name: "🐛 Bug Report"
description: "Report a technical error — broken SUSHI build, invalid FHIR, broken link, or tooling issue"
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SUSHI build / FSH syntax error
        - Invalid FHIR resource or profile
        - Broken link or URL
        - Incorrect terminology binding (SNOMED/LOINC/UCUM)
        - GitHub Actions / CI workflow
        - Documentation error
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: "Running 'sushi .' produces error: ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Clone repo
        2. Run sushi .
        3. See error in output/...

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "SUSHI v3.x, Node 20, macOS / Windows / Linux"
